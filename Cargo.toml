[package]
authors = ["Jorge D. Ortiz-Fuentes <jdortiz@gmail.com>"]
name = "lazycoder"
description = "Simple snippet provider for espanso."
version = "0.8.1"
edition = "2024"

[dependencies]
clap = { version = "~4.6", features = ["derive"] }
directories = "~6.0"
env_logger = "~0.11"
eyre = "~0.6"
log = "~0.4"
serde = { version = "^1.0", features = ["derive"] }
sha2 = "~0.11"
thiserror = "~2.0"
toml = "~1.2"

[dev-dependencies]
mockall = "~0.15"
mockall_double = "~0.3"
tempfile = "~3.27"

[lints.clippy]
pedantic = "warn"
